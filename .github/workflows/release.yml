name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download DMG
        uses: actions/download-artifact@v7
        with:
          name: retone-macos-arm64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dmg="ReTone-${TAG#v}-arm64.dmg"
          mv dist/ReTone.dmg "dist/$dmg"
          (cd dist && shasum -a 256 "$dmg" > "$dmg.sha256")
          cat > notes.md <<EOF
          ReTone $TAG for macOS on Apple silicon (M1 or later), macOS 26 or later.

          ### Install
          1. Download \`$dmg\`, open it and drag **ReTone** to **Applications**.
          2. Open ReTone. This build is signed ad-hoc and not notarized, so macOS blocks the first launch:
             - Click **Done**, then go to System Settings › Privacy & Security, scroll down and click **Open Anyway** next to ReTone.
             - Or, in Terminal: \`xattr -dr com.apple.quarantine /Applications/ReTone.app\`
          3. Grant **Accessibility** when asked (System Settings › Privacy & Security › Accessibility). ReTone needs it to read your selection and paste the rewrite.
          4. In Settings, set a hotkey and choose a model.

          ### Updating
          Replace the app in Applications. macOS ties the Accessibility grant to each build, so remove the old ReTone entry in Accessibility (the **−** button) and grant it again.

          ### Verify the download
          \`shasum -a 256 -c $dmg.sha256\` (run in the folder with both files).
          EOF
          gh release create "$TAG" "dist/$dmg" "dist/$dmg.sha256" \
            --repo anarefin/retone \
            --latest \
            --title "ReTone $TAG" \
            --notes-file notes.md \
            --generate-notes
