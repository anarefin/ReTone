[package]
name = "retone-llama"
description = "llama-server lifecycle, model manager and downloads for ReTone"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "time", "process", "io-util", "fs", "macros", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
libc = "0.2"

[dev-dependencies]
# The app enables TLS through its own reqwest; the smoke test needs it here.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "process", "io-util", "fs", "macros", "net", "test-util"] }

[lints]
workspace = true
